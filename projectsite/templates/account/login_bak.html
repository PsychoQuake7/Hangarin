{% load socialaccount %} {% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Hangarin Login</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
    <div class="auth-card text-center">
        <ul class="nav nav-pills nav-justified mb-4" id="ex1" role="tablist">
            <li class="nav-item" role="presentation">
                <a class="nav-link active" href="{% url 'account_login' %}">Login</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" href="{% url 'account_signup' %}">Register</a>
            </li>
        </ul>

        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            <div class="text-center mb-3">
                <p class="fw-bold mb-2">Sign in with</p>
                <a href="{% provider_login_url 'google' %}" class="btn btn-link btn-floating mx-1" title="Sign in with Google">
                    <i class="fab fa-google fa-lg"></i>
                </a>
                <a href="{% provider_login_url 'github' %}" class="btn btn-link btn-floating mx-1" title="Sign in with GitHub">
                    <i class="fab fa-github fa-lg"></i>
                </a>
            </div>

            <p class="text-center text-light mb-3">or</p>

            <div data-mdb-input-init class="form-outline mb-4">
                <input type="text" name="login" id="id_login" class="form-control" required />
                <label class="form-label" for="id_login">Email or Username</label>
            </div>

            <div data-mdb-input-init class="form-outline mb-4">
                <input type="password" name="password" id="id_password" class="form-control" required />
                <label class="form-label" for="id_password">Password</label>
            </div>

            <div class="row mb-4 text-start text-light">
                <div class="col-md-6">
                    <div class="form-check mb-3 mb-md-0">
                        <input class="form-check-input" type="checkbox" id="loginCheck" checked />
                        <label class="form-check-label" for="loginCheck"> Remember me </label>
                    </div>
                </div>
                <div class="col-md-6 text-end">
                    <a href="{% url 'account_reset_password' %}">Forgot password?</a>
                </div>
            </div>

            {% if form.non_field_errors %}
            <div class="alert alert-danger" role="alert">
                {% for error in form.non_field_errors %}
                <p{% if forloop.last %} class="mb-0" {% endif %}>{{ error }}</p>
                    {% endfor %}
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary btn-block mb-4">Sign in</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.js"></script>
</body>
</html>
